name: KayKit art rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/art/acquire.py
      - run: python scripts/art/setup_blender.py
      - uses: actions/upload-artifact@v4
        with:
          name: kaykit-knight-variants
          path: apps/client/public/assets/kaykit/
          retention-days: 14
